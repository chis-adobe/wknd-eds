name: Update Component Library

# Run on a schedule (daily) or manually - picks up latest @ac-comp-lib/component-library
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 9:00 AM UTC daily

permissions:
  contents: write
  pull-requests: write

jobs:
  update-component-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update component library to latest
        run: npm run update:component-library

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package-lock.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with updates
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="update-component-library-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git add package-lock.json
          git commit -m "chore: update @ac-comp-lib/component-library to latest"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "Update component library to latest" \
            --body "Automated update from @ac-comp-lib/component-library. Merge to pull in the latest promo-banner styles and template." \
            --base main \
            --head "$BRANCH_NAME"

      - name: No updates needed
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "## ✅ Component library is up to date" >> $GITHUB_STEP_SUMMARY
          echo "No new version available or already on latest." >> $GITHUB_STEP_SUMMARY
